<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in… · City Metro Alerts</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f0f4f8;
         font-family: Helvetica Neue, Helvetica, Arial, sans-serif; color:#0f172a; }
  .box { text-align:center; max-width:360px; padding:24px; }
  .spin { width:28px; height:28px; border:3px solid #cbd5e1; border-top-color:#3b82f6; border-radius:50%;
          margin:0 auto 16px; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  a { color:#2563eb; }
  .err { display:none; }
</style>
</head>
<body>
<div class="box">
  <div id="working"><div class="spin"></div><p>Signing you in…</p></div>
  <div id="failed" class="err">
    <p id="msg" style="margin-bottom:12px"></p>
    <a href="/portal">Back to notifications</a>
  </div>
</div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  MetroAuth.handleCallback()
    .then(dest => location.replace(dest))
    .catch(e => {
      document.getElementById('working').style.display = 'none';
      document.getElementById('failed').style.display = 'block';
      document.getElementById('msg').textContent = e.message;
    });
</script>
</body>
</html>
